[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aperture-engine"
version = "0.1.0"
description = "Wave-gated conditional transformation engine — nultra aperture math fused with the CEO condition algebra."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eric D. McCullar", email = "MASAGDT@gmail.com" }]
keywords = [
    "aperture",
    "nultra",
    "wave",
    "gating",
    "condition",
    "transformation",
    "rotation-gate",
    "consensus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
dev = ["pytest>=7.0", "numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/MASAGDT/aperture-engine"
Source = "https://github.com/MASAGDT/aperture-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aperture_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
